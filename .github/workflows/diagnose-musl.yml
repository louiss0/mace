name: Diagnose processor musl

# This diagnostic intentionally fails while stock Go cannot produce a usable
# musl c-shared library. Run it manually when evaluating a newer Go toolchain.
on:
  workflow_dispatch:
    inputs:
      go_image:
        description: Alpine-based Go image to evaluate
        required: true
        default: golang:1.25.5-alpine
        type: string

permissions:
  contents: read

jobs:
  alpine-amd64:
    name: Native Alpine amd64 C ABI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Exercise trivial and processor c-shared libraries under musl
        env:
          GO_IMAGE: ${{ inputs.go_image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --volume "$PWD:/src" \
            --workdir /src \
            "$GO_IMAGE" \
            sh -c 'apk add --no-cache bash binutils build-base gdb git && bash cmd/processor-abi/tests/musl_smoke.sh'
