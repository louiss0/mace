name: Release processor

# Processor artifacts ship on their own cadence from the CLI. A run is only
# allowed for a commit that already carries a processor/vX.Y.Z tag so the
# bindings can pin an immutable version.
on:
  push:
    tags:
      - 'processor/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing processor/vX.Y.Z tag to publish
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target.target }}
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the musl cross toolchain
        if: matrix.target.libc == 'musl'
        uses: mymindstorm/setup-zig@v2
        with:
          version: '0.13.0'

      - name: Build the shared library
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CC: ${{ matrix.target.libc == 'musl' && 'zig cc -target' || 'cc' }}
          CGO_CFLAGS: ${{ matrix.target.libc == 'musl' && format('-target {0}-{1}-linux-musl', matrix.target.goarch, matrix.target.goos) || '' }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target.target }}"
          go build -buildmode=c-shared \
            -ldflags '-s -w' \
            -o "dist/${{ matrix.target.target }}/${{ matrix.target.filename }}" \
            ./cmd/processor-abi
          cp cmd/processor-abi/processor.h "dist/${{ matrix.target.target }}/processor.h"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the library reports the expected ABI
        env:
          MACE_PROCESSOR_LIBRARY: ${{ github.workspace }}/dist/${{ matrix.target.target }}/${{ matrix.target.filename }}
        run: python cmd/processor-abi/abi_test.py

      - name: Upload the variant
        uses: actions/upload-artifact@v4
        with:
          name: processor-${{ matrix.target.target }}
          path: |
            dist/${{ matrix.target.target }}/${{ matrix.target.filename }}
            dist/${{ matrix.target.target }}/processor.h
          if-no-files-found: error
          retention-days: 7

  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - name: Read the target list
        id: read
        run: echo "targets=$(jq -c '.targets' processor-targets.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [targets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="$(git tag --points-at HEAD | grep -E '^processor/v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          if [[ ! "$tag" =~ ^processor/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release requires an existing processor/vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          echo "PROCESSOR_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download every variant
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: processor-*
          merge-multiple: true

      - name: Reject a partial release
        run: |
          set -euo pipefail
          expected="$(jq '.targets | length' processor-targets.json)"
          found="$(find artifacts -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [[ "$found" -ne "$expected" ]]; then
            echo "Expected $expected processor variants but downloaded $found." >&2
            exit 1
          fi

      - name: Stage artifacts and checksums
        id: stage
        run: |
          set -euo pipefail
          mkdir -p stage
          jq -r '.targets[] | [.target, .filename] | @tsv' processor-targets.json | while read -r target filename; do
            mkdir -p "stage/$target"
            cp "artifacts/$target/$filename" "stage/$target/$filename"
            cp "artifacts/$target/processor.h" "stage/$target/processor.h"
          done
          (cd stage && find . -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt)
          cp stage/checksums.txt .

      - name: Build the release manifest
        run: |
          set -euo pipefail
          jq --rawfile checksums checksums.txt '
            .version = $version |
            .targets = [
              .targets[] |
              .artifact = "mace-processor/\(.target)/\(.filename)" |
              .sha256 = ($checksums | split("\n") | map(select(length > 0) | split(" ") | {(.[1] | ltrimstr("./")): .[0]}) | add)["stage/\(.target)/\(.filename)"]
            ]
          ' --arg version "${PROCESSOR_TAG#processor/}" processor-targets.json > processor-manifest.json
          jq -e '[.targets[] | select(.sha256 == null or .sha256 == "")] | length == 0' processor-manifest.json > /dev/null

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'stage/**'

      - name: Create the processor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${PROCESSOR_TAG}" \
            --title "${PROCESSOR_TAG}" \
            --generate-notes \
            --verify-tag \
            processor-manifest.json \
            checksums.txt \
            stage/*/*
