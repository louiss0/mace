name: Release processor

# Processor artifacts ship on their own cadence from the CLI. A run is only
# allowed for a commit that already carries a processor/vX.Y.Z tag so the
# bindings can pin an immutable version.
on:
  push:
    tags:
      - 'processor/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing processor/vX.Y.Z tag to publish
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target.target }}
    needs: [targets]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the shared library
        # Windows runners default to PowerShell, which cannot run these steps.
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CC: cc
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target.target }}"
          go build -buildmode=c-shared \
            -ldflags '-s -w' \
            -o "dist/${{ matrix.target.target }}/${{ matrix.target.filename }}" \
            ./cmd/processor-abi
          cp cmd/processor-abi/processor.h "dist/${{ matrix.target.target }}/processor.h"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The C smoke test is the only check that proves the exported symbols are
      # reachable and correctly shaped through a real C toolchain on this target.
      # Windows has no import library for a Go c-shared DLL, so its test loads
      # the library by name instead of linking against it.
      - name: Verify the C ABI from a C program
        shell: bash
        env:
          TARGET: ${{ matrix.target.target }}
          LIBRARY: ${{ github.workspace }}/dist/${{ matrix.target.target }}/${{ matrix.target.filename }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target.goos }}" == "windows" ]]; then
            clang cmd/processor-abi/tests/abi_smoke_windows.c -Icmd/processor-abi -o "dist/$TARGET/abi_smoke.exe"
            "dist/$TARGET/abi_smoke.exe" "$LIBRARY"
          else
            gcc cmd/processor-abi/tests/abi_smoke.c -Icmd/processor-abi "$LIBRARY" -o "dist/$TARGET/abi_smoke"
            DYLD_LIBRARY_PATH="$PWD/dist/$TARGET" LD_LIBRARY_PATH="$PWD/dist/$TARGET" "dist/$TARGET/abi_smoke"
          fi

      - name: Verify the library reports the expected ABI
        env:
          MACE_PROCESSOR_LIBRARY: ${{ github.workspace }}/dist/${{ matrix.target.target }}/${{ matrix.target.filename }}
        run: python cmd/processor-abi/abi_test.py

      - name: Upload the variant
        uses: actions/upload-artifact@v4
        with:
          name: processor-${{ matrix.target.target }}
          path: |
            dist/${{ matrix.target.target }}/${{ matrix.target.filename }}
            dist/${{ matrix.target.target }}/processor.h
          if-no-files-found: error
          retention-days: 7

  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.read.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # An empty or unreadable target list would silently produce a zero-job
      # matrix, so this fails loudly instead of publishing nothing.
      - name: Read the target list
        id: read
        shell: bash
        run: |
          set -euo pipefail
          targets="$(jq -c '.targets' processor-targets.json)"
          count="$(jq '.targets | length' processor-targets.json)"
          if [[ "$count" -eq 0 ]]; then
            echo "processor-targets.json lists no targets." >&2
            exit 1
          fi
          echo "Building $count processor variants"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  publish:
    needs: [targets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            # A shallow tag checkout does not always carry a local tag ref.
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^processor/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release requires an existing processor/vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          echo "PROCESSOR_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download every variant
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: processor-*
          # Each variant must keep its own directory so a missing target is visible.
          merge-multiple: false

      - name: Reject a partial release
        run: |
          set -euo pipefail
          expected="$(jq '.targets | length' processor-targets.json)"
          found="$(find artifacts -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [[ "$found" -ne "$expected" ]]; then
            echo "Expected $expected processor variants but downloaded $found." >&2
            exit 1
          fi

      - name: Stage artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p stage
          # processor.h is identical for every target, so it is published once.
          cp "artifacts/processor-darwin-amd64/processor.h" stage/processor.h
          jq -r '.targets[] | [.target, .filename] | @tsv' processor-targets.json | while read -r target filename; do
            mkdir -p "stage/$target"
            # Release asset names must be unique, and several targets share a
            # library basename, so each asset carries its target.
            asset="mace-processor-$target.${filename##*.}"
            cp "artifacts/processor-$target/$filename" "stage/$target/$asset"
          done
          # Generated from the workspace root so every recorded path is already
          # stage/<target>/<filename>, which is what the manifest looks up.
          find stage -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > stage/checksums.txt
          cp stage/checksums.txt .

      - name: Build the release manifest
        run: |
          set -euo pipefail
          # sha256sum separates the hash and the path with two spaces.
          jq --rawfile checksums checksums.txt --arg version "${PROCESSOR_TAG#processor/v}" '
            ($checksums | split("\n")
             | map(select(length > 0) | split("  ") | {(.[1] | ltrimstr("./")): .[0]})
             | add) as $digests
            | .version = $version
            | .targets = [
                .targets[]
                | .asset = "mace-processor-\(.target).\(.filename | split(".") | last)"
                | .artifact = "mace-processor/\(.asset)"
                | .sha256 = $digests["stage/\(.target)/\(.asset)"]
              ]
          ' processor-targets.json > processor-manifest.json
          jq -e '[.targets[] | select(.sha256 == null or .sha256 == "")] | length == 0' processor-manifest.json > /dev/null
          cat processor-manifest.json

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'stage/**'

      - name: Create the processor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${PROCESSOR_TAG}" \
            --title "${PROCESSOR_TAG}" \
            --generate-notes \
            --verify-tag \
            processor-manifest.json \
            checksums.txt \
            stage/processor.h \
            stage/*/*
