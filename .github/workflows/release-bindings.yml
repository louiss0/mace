name: release-bindings

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix.
        required: true
        type: string
      release_ref:
        description: Commit SHA to publish.
        required: true
        type: string

permissions:
  contents: read

jobs:

  publish-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load npm token
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          NPM_TOKEN: op://Development/Code Fixer 23 NPM Token/credential

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml

      - name: Apply release version to Node package
        working-directory: bindings/node
        shell: bash
        run: |
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version='${{ inputs.version }}'; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');"

      - name: Install and build Node binding
        working-directory: bindings/node
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Publish Node binding
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public

  publish-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v2
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load PyPI tokens
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          PY_TEST_TOKEN: op://Development/PY_TEST_TOKEN/credential
          PY_TOKEN: op://Development/PY_TOKEN/credential

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --user uv

      - name: Apply release version to Python package
        working-directory: bindings/python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pyproject.toml')
          text = path.read_text()
          old = 'version = "0.1.0"'
          new = 'version = "${{ inputs.version }}"'
          if old not in text:
              raise SystemExit('expected version entry not found in pyproject.toml')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build Python binding
        working-directory: bindings/python
        run: |
          python -m uv sync
          python -m uv build

      - name: Publish Python binding to TestPyPI
        working-directory: bindings/python
        run: python -m uv publish --token "$PY_TEST_TOKEN" --publish-url https://test.pypi.org/legacy/

      - name: Publish Python binding to PyPI
        working-directory: bindings/python
        run: python -m uv publish --token "$PY_TOKEN"