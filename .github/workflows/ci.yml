name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Go tests with coverage
        run: |
          # The C ABI is exercised below as a shared library; Go coverage cannot
          # observe calls crossing the C boundary in an external process.
          packages=$(go list ./... | grep -v '^github.com/louiss0/mace/cmd/processor-abi$')
          go test -covermode=atomic -coverprofile=coverage.out $packages
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "total coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 90) exit 1 }'

      - name: Build and exercise the processor C ABI
        run: |
          CGO_ENABLED=1 go build -buildmode=c-shared -o "$RUNNER_TEMP/libmace_processor.so" ./cmd/processor-abi
          gcc -Icmd/processor-abi cmd/processor-abi/tests/abi_smoke.c -L"$RUNNER_TEMP" -lmace_processor -o "$RUNNER_TEMP/abi_smoke"
          LD_LIBRARY_PATH="$RUNNER_TEMP" "$RUNNER_TEMP/abi_smoke"
          MACE_PROCESSOR_LIBRARY="$RUNNER_TEMP/libmace_processor.so" python3 cmd/processor-abi/abi_test.py
