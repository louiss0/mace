name: Release

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_tag.outputs.version }}
      release_ref: ${{ steps.release_tag.outputs.release_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$tag" ]]; then
            echo "The selected commit is not tagged with a vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi
          release_ref="$(git rev-parse HEAD)"
          echo "MACE_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MACE_RELEASE_REF=$release_ref" >> "$GITHUB_ENV"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.18.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify Nix installation
        run: |
          nix --version
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "NIX_PATH=$NIX_PATH" >> "$GITHUB_ENV"
          if [ -n "${NIX_PROFILES:-}" ]; then
            echo "NIX_PROFILES=$NIX_PROFILES" >> "$GITHUB_ENV"
          fi
          if [ -n "${NIX_SSL_CERT_FILE:-}" ]; then
            echo "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" >> "$GITHUB_ENV"
          fi

      - name: Ensure nix-prefetch-url is available
        run: |
          export PATH="$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          which nix
          which nix-prefetch-url || true

      - name: Write GoReleaser deploy keys
        env:
          GORELEASER_WINGET_DEPLOY_KEY_B64: ${{ secrets.GORELEASER_WINGET_DEPLOY_KEY_B64 }}
          GORELEASER_HOMEBREW_DEPLOY_KEY_B64: ${{ secrets.GORELEASER_HOMEBREW_DEPLOY_KEY_B64 }}
          GORELEASER_NIX_DEPLOY_KEY_B64: ${{ secrets.GORELEASER_NIX_DEPLOY_KEY_B64 }}
          SCOOP_PRIVATE_KEY_B64: ${{ secrets.SCOOP_PRIVATE_KEY_B64 }}
        run: |
          write_base64_key() {
            key_path="$1"
            key_value="$2"

            umask 077
            printf '%s' "$key_value" | tr -d '\r\n' | base64 --decode > "$key_path"
            chmod 600 "$key_path"
          }

          winget_key_path="$RUNNER_TEMP/goreleaser-winget"
          homebrew_key_path="$RUNNER_TEMP/goreleaser-homebrew"
          nix_key_path="$RUNNER_TEMP/goreleaser-nix"
          scoop_key_path="$RUNNER_TEMP/goreleaser-scoop"

          write_base64_key "$winget_key_path" "$GORELEASER_WINGET_DEPLOY_KEY_B64"
          write_base64_key "$homebrew_key_path" "$GORELEASER_HOMEBREW_DEPLOY_KEY_B64"
          write_base64_key "$nix_key_path" "$GORELEASER_NIX_DEPLOY_KEY_B64"
          write_base64_key "$scoop_key_path" "$SCOOP_PRIVATE_KEY_B64"

          {
            echo "GORELEASER_WINGET_DEPLOY_KEY_PATH=$winget_key_path"
            echo "GORELEASER_HOMEBREW_DEPLOY_KEY_PATH=$homebrew_key_path"
            echo "GORELEASER_NIX_DEPLOY_KEY_PATH=$nix_key_path"
            echo "SCOOP_PRIVATE_KEY_PATH=$scoop_key_path"
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load secret
        id: load_secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_GENERAL_TOKEN: "op://Development/GENERAL_TOKEN GH--PT Fine Grained/credential"

      - name: Checkout Zed extension repository
        uses: actions/checkout@v5
        with:
          repository: louiss0/zed-extension-mace
          token: ${{ steps.load_secrets.outputs.GH_GENERAL_TOKEN }}
          path: zed-extension-mace

      - name: Update Zed version file
        run: |
          VERSION="${MACE_RELEASE_TAG}"

          cat > zed-extension-mace/mace-version.json <<EOF
          {
            "version": "${VERSION}",
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${MACE_RELEASE_REF}"
          }
          EOF

      - name: Commit and push Zed branch
        working-directory: zed-extension-mace
        run: |
          VERSION="${MACE_RELEASE_TAG}"
          BRANCH_NAME="chore/update-mace-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"

          git add mace-version.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Mace version to ${VERSION}"
          git push origin "$BRANCH_NAME"

      - name: Checkout VS Code extension repository
        uses: actions/checkout@v5
        with:
          repository: louiss0/vscode-extension-mace
          token: ${{ steps.load_secrets.outputs.GH_GENERAL_TOKEN }}
          path: vscode-extension-mace

      - name: Update VS Code version file
        run: |
          VERSION="${MACE_RELEASE_TAG}"

          cat > vscode-extension-mace/mace-version.json <<EOF
          {
            "version": "${VERSION}",
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_commit": "${MACE_RELEASE_REF}"
          }
          EOF

      - name: Commit and push VS Code branch
        working-directory: vscode-extension-mace
        run: |
          VERSION="${MACE_RELEASE_TAG}"
          BRANCH_NAME="chore/update-mace-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"

          git add mace-version.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Mace version to ${VERSION}"
          git push origin "$BRANCH_NAME"

  publish-bindings:
    needs: release
    uses: ./.github/workflows/release-bindings.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_ref: ${{ needs.release.outputs.release_ref }}
    secrets: inherit
